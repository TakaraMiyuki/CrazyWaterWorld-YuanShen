plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

def aliyunFirst = providers.gradleProperty('barotrauma.aliyun').getOrElse('false').toBoolean()

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // VS2 是正式环境编译的，它的 mixin 里写的是 SRG 名（m_130011_ 这种）。
            // 开发环境跑的是官方名，不重映射的话 MixinMinecraftServer 找不到目标、直接崩。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // 独立运行目录：和服务端同时跑时不能共用 run/（否则 mods、日志、NBT 全打架）
            workingDirectory project.file('run-client')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    // 默认标准仓库；大陆网络在用户级 gradle.properties 设置
    // barotrauma.aliyun=true，把阿里云镜像放到最前。
    if (aliyunFirst) {
        maven {
            name = 'AliyunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
    } else {
        mavenCentral()
    }
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'MojangLibraries'
        url = 'https://libraries.minecraft.net/'
    }
    // 瓦尔基里天空 2（VS2）。LGPL-3.0，只在编译期引用，正式包不打包。
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

configurations {
    // 只用来从 VS2 的 jar-in-jar 里抽 API；不参与运行/打包。
    vs2ApiSource {
        transitive = false
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin 注解处理器：后面要写 @Mixin 注入时直接可用。
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 物理引擎：VS2 提供船的刚体运动/碰撞/质量。
    // 正式包不打包 VS2（LGPL-3.0 的常规用法），但开发期要装上来跑 —— 所以要 runtimeOnly。
    // vs-core 的 API 在 VS2 的 jar-in-jar 里（META-INF/jars/api-*.jar），FG 不会自动摊到
    // 编译期 classpath 上；构建时用 extractVs2Api 从 vs2_version 对应的 jar 里自动抽出，
    // 不再提交一份会与 vs2_version 漂移的手工 jar。
    compileOnly fg.deobf("maven.modrinth:valkyrien-skies:${vs2_version}")
    compileOnly files("$buildDir/vs2-api/vs2-api.jar")
    vs2ApiSource "maven.modrinth:valkyrien-skies:${vs2_version}"
    // VS2 的 API 接口继承了 Kotlin 集合类型（QueryableShipData : KMappedMarker），
    // 编译期必须能看见 kotlin-stdlib，否则用不了 getLoadedShips()。
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    runtimeOnly fg.deobf("maven.modrinth:valkyrien-skies:${vs2_version}")
    // VS2 的类是用 Kotlin 写的，但 jar 里没有 kotlin-stdlib，必须另外装 Kotlin for Forge。
    runtimeOnly fg.deobf("maven.modrinth:kotlin-for-forge:${kff_version}")

    // ---- 测试（按 minecraft-testing 技能的三层策略，见 PLAN.md §10.37）----
    // L1：纯逻辑单测。ShipPhysics / ShipGeometry / ShipSimulation 都是不依赖 Level 的
    // 纯计算类，能在没有 Minecraft 引导的情况下跑，所以放 JUnit Jupiter。
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 从 VS2 的 jar-in-jar 里抽出 vs-core API。升级 vs2_version 后会自动跟着变，
// 不需要再手工从 META-INF/jars/api-*.jar 里复制一份提交进仓库。
def vs2ApiDir = layout.buildDirectory.dir('vs2-api')
tasks.register('extractVs2Api', Copy) {
    from({ zipTree(configurations.vs2ApiSource.singleFile) }) {
        include 'META-INF/jars/api-*.jar'
        eachFile { it.path = 'vs2-api.jar' }
        includeEmptyDirs = false
    }
    into vs2ApiDir
    doLast {
        def jar = vs2ApiDir.get().file('vs2-api.jar').asFile
        if (!jar.exists()) {
            throw new GradleException("VS2 API jar not found; check vs2_version and the jar-in-jar layout")
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('extractVs2Api')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// L1 单测：must 能用 `gradlew test` 跑，不需要开游戏。
tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

mixin {
    add sourceSets.main, "barotrauma.refmap.json"
    config "barotrauma.mixins.json"
}
