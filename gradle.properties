# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -Dnet.minecraftforge.gradle.check.certs=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Forge 1.20.1 使用 Gradle 8.1.1 + ForgeGradle 6，只能运行在 JDK 17 上。
# 这里固定 JDK 路径，避免系统 JAVA_HOME 指向 JDK 21 时构建直接失败。
# 换机器时改成自己的 JDK 17 路径即可。
org.gradle.java.home=C:/Program Files/Java/jdk-17

# ---------------------------------------------------------------------------
# 本地代理（Clash Verge 默认 127.0.0.1:7897）
# 不需要代理时把下面 5 行注释掉，Gradle 会走直连。
# ---------------------------------------------------------------------------
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.*|[::1]

# ---------------------------------------------------------------------------
# 模组元数据（mods.toml 里的 ${...} 会由这里的值替换）
# ---------------------------------------------------------------------------
mod_id=barotrauma
mod_name=Barotrauma
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.opamb.barotrauma
mod_authors=opAmb
# 注意：gradle.properties 按 ISO-8859-1/GBK 解码，值里不要写中文，否则 mods.toml 会乱码。
mod_description=Barotrauma-themed deep sea submarines, oxygen gear and diving equipment.

# 资源下载走代理较慢，放宽 HttpURLConnection 的超时（默认无限/较短易触发 read timeout）。
systemProp.sun.net.client.defaultConnectTimeout=60000
systemProp.sun.net.client.defaultReadTimeout=120000

# ---------------------------------------------------------------------------
# Forge / Minecraft 版本
# ---------------------------------------------------------------------------
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47,)
loader_version_range=[47,)

# official / parchment / srg。parchment 能补全参数名，需要额外下载。
mapping_channel=official
mapping_version=1.20.1
# Valkyrien Skies 2（LGPL-3.0，仅编译期）
vs2_version=1.20.1-forge-2.4.11
# Kotlin for Forge：VS2 的类依赖 kotlin-stdlib，但它的 mods.toml 没声明
kff_version=4.12.0
