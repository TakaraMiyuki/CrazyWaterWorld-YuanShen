pluginManagement {
    repositories {
        // 国内镜像优先：repo.maven.apache.org 与 plugins.gradle.org 在本机返回 403。
        maven {
            name = 'AliyunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
        maven {
            name = 'AliyunGradlePlugin'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        // ForgeGradle 插件本体与 Forge 依赖走这里。
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

rootProject.name = 'barotrauma'
